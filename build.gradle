plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'
}

subprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    version = project.mod_version + "+" + project.minecraft_version
    group = project.maven_group

    repositories {
        mavenLocal()
        maven { url 'https://maven.nucleoid.xyz' }
        maven { url 'https://maven.supersanta.me/snapshots' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings loom.officialMojangMappings()
        compileOnly "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
        compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
        localRuntime "net.fabricmc:fabric-loader:${project.loader_version}"
        compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": inputs.properties.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${project.base.archivesName.get()}"}
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = project.base.archivesName.get()
                from components.java
            }
        }
    }
}
