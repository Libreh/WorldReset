plugins {
    id 'fabric-loom'
}

base.archivesName = "worldreset-api"

loom {
    runConfigs.clear()
    mods {
        "worldreset-api" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    modImplementation("net.casualchampionships:arcade-dimensions:${project.arcade_version}")
}
