plugins {
    id "com.modrinth.minotaur" version "2.+"
}

base.archivesName = "worldreset"

loom {
    mods {
        "worldreset" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // namedElements = the dev (named-mappings) jar, so runServer doesn't pick up the
    // remapped intermediary jar and try to apply its mixins against class_3898 etc.
    api project(path: ":worldreset-api", configuration: "namedElements")
    include project(path: ":worldreset-api")

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.5"

    // 0.3.3 drags in fabric-api-bom 0.106.1+1.21.3, whose constraints bump fabric-api
    // submodules (entity-events, content-registries, ...) to 1.21.3 builds that crash
    // against 1.21.1. We already have the real 1.21.1 fabric-api on the classpath.
    modCompileOnly("me.lucko:fabric-permissions-api:${project.permissions_api_version}") { exclude group: "net.fabricmc.fabric-api" }
    modLocalRuntime("me.lucko:fabric-permissions-api:${project.permissions_api_version}") { exclude group: "net.fabricmc.fabric-api" }
    include("me.lucko:fabric-permissions-api:${project.permissions_api_version}") { exclude group: "net.fabricmc.fabric-api" }

    modCompileOnly "eu.pb4:predicate-api:${project.predicate_api_version}"
    modLocalRuntime "eu.pb4:predicate-api:${project.predicate_api_version}"
    include "eu.pb4:predicate-api:${project.predicate_api_version}"

    modCompileOnly "net.casualchampionships:arcade-dimensions:${project.arcade_version}"
    modCompileOnly "net.casualchampionships:arcade-event-registry:${project.arcade_version}"
    modCompileOnly "net.casualchampionships:arcade-events-server:${project.arcade_version}"
    modCompileOnly "net.casualchampionships:arcade-extensions:${project.arcade_version}"
    modCompileOnly "net.casualchampionships:arcade-utils:${project.arcade_version}"

    modLocalRuntime "net.casualchampionships:arcade-dimensions:${project.arcade_version}"
    modLocalRuntime "net.casualchampionships:arcade-event-registry:${project.arcade_version}"
    modLocalRuntime "net.casualchampionships:arcade-events-server:${project.arcade_version}"
    modLocalRuntime "net.casualchampionships:arcade-extensions:${project.arcade_version}"
    modLocalRuntime "net.casualchampionships:arcade-utils:${project.arcade_version}"

    include "net.casualchampionships:arcade-dimensions:${project.arcade_version}"
    include "net.casualchampionships:arcade-event-registry:${project.arcade_version}"
    include "net.casualchampionships:arcade-events-server:${project.arcade_version}"
    include "net.casualchampionships:arcade-extensions:${project.arcade_version}"
    include "net.casualchampionships:arcade-utils:${project.arcade_version}"
}

var isStable = project.is_stable == "true"

if (System.getenv("MODRINTH")) {
    modrinth {
        token = System.getenv("MODRINTH")
        projectId = 'wDzF9EIN'
        versionNumber = "" + version
        versionType = isStable ? "release" : "beta"
        uploadFile = jar
        gameVersions = [((String) project.minecraft_version)]
        changelog = System.getenv("CHANGELOG")
        loaders = ["fabric", "quilt"]
        dependencies {
            required.project "fabric-api"
            required.project "fabric-language-kotlin"
            embedded.project "fabric-permissions-api"
        }
    }

    jar {
        finalizedBy project.tasks.modrinth
    }
}
